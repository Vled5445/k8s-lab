# ============================================================
# Шаблон к заданию 2. Pod — «Запустить приложение»
# ------------------------------------------------------------
# Напоминание из лекции: Pod — минимальная единица Kubernetes.
# Один под = один или несколько контейнеров с общим IP-адресом.
#
# Заполните все места, отмеченные <ВПИШИТЕ ...>.
# Подсказки даны в комментариях. Проверка: kubectl apply --dry-run.
# ============================================================

apiVersion: v1          # версия API. Для Pod всегда "v1"
kind: Pod               # тип объекта. Мы создаём именно Pod

metadata:
  # Придумайте имя пода. Договоримся: имя = calc-pod
  name: calc-pod
  labels:
    # Label — это "бирка" на поде. Она пригодится в задании 4,
    # где Service будет искать поды именно по этой бирке.
    # Договоримся: app: calc-app
    app: calc-app

spec:
  containers:
    - name: calc-app
      # Образ мы собрали из папки ../app и загрузили в minikube:
      #   docker build -t calc-app:v1 ../app
      #   minikube image load calc-app:v1
      image: calc-app:v1
      # ВАЖНО: образ локальный, в интернете его нет.
      # Какая политика не даст kubelet тянуть образ из сети?
      # (Always / IfNotPresent / Never — вспомните лекцию)
      imagePullPolicy: Never
      ports:
        # На каком порту слушает наше приложение?
        # Подсмотрите в ../app/app.py, если забыли.
        - containerPort: 5000

# ------------------------------------------------------------
# После заполнения:
#   kubectl apply -f pod.yaml
#   kubectl get pods          # дождитесь Running
#   kubectl port-forward calc-pod 5000:5000
#   curl "http://localhost:5000/calc?op=mul&a=6&b=7"
# Ожидается: {"result":42.0}
# ------------------------------------------------------------
